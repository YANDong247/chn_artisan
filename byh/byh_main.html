<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>鼻烟壶 · 琉璃藏境</title>
  <style>
    :root {
      --bg: #060709;
      --bg-soft: #0f1319;
      --ink: #f5f4f0;
      --ink-soft: #b6bec9;
      --line: rgba(255, 255, 255, 0.14);
      --gold: #d7a46f;
      --gold-soft: #f0c18c;
      --card: rgba(20, 24, 31, 0.72);
      --radius: 22px;
      --shadow: 0 22px 48px rgba(0, 0, 0, 0.45);
      --max: 1180px;
      --ease: 480ms cubic-bezier(.22, 1, .36, 1);
      --title: clamp(2.2rem, 10vw, 6.3rem);
      --subtitle: clamp(1.4rem, 5vw, 2.2rem);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      padding: 0;
      background:
        radial-gradient(1200px 540px at 50% -6%, rgba(247, 183, 117, 0.16), transparent 60%),
        linear-gradient(180deg, #050608 0%, #0a0d12 36%, #0f141b 68%, #090b10 100%);
      color: var(--ink);
      font-family: "Noto Serif SC", "Source Han Serif SC", "STSong", serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      scroll-behavior: smooth;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image:
        radial-gradient(circle at 14% 18%, rgba(255, 215, 174, 0.12) 1px, transparent 1px),
        radial-gradient(circle at 76% 72%, rgba(226, 178, 129, 0.1) 1px, transparent 1px);
      background-size: 24px 24px, 22px 22px;
      z-index: 1;
    }

    .page {
      position: relative;
      z-index: 2;
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 18px 80px;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      backdrop-filter: blur(8px);
      border-bottom: 1px solid transparent;
      transition: border-color var(--ease), background var(--ease);
    }

    .nav.scrolled {
      border-color: var(--line);
      background: rgba(8, 11, 16, 0.72);
    }

    .logo {
      text-decoration: none;
      color: var(--ink);
      letter-spacing: 0.11em;
      text-transform: uppercase;
      font-size: 0.78rem;
    }

    .buy-mini {
      text-decoration: none;
      color: var(--ink);
      background: #000;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.82rem;
      border: 1px solid var(--line);
    }

    .hero {
      min-height: 92vh;
      display: grid;
      align-content: end;
      gap: 20px;
      padding: 72px 0 28px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 12% -12% 0;
      background:
        radial-gradient(circle at 55% 40%, rgba(255, 198, 136, 0.24), transparent 50%),
        radial-gradient(circle at 18% 70%, rgba(144, 188, 255, 0.16), transparent 56%);
      filter: blur(16px);
      pointer-events: none;
    }

    .hero-kicker {
      color: var(--gold);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.72rem;
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 6.6vw, 4.6rem);
      line-height: 0.94;
      letter-spacing: -0.02em;
      max-width: none;
      white-space: nowrap;
      position: relative;
      z-index: 1;
    }

    .hero p {
      margin: 0;
      max-width: 34ch;
      color: var(--ink-soft);
      line-height: 1.78;
      position: relative;
      z-index: 1;
    }

    .hero-img {
      width: min(540px, 86vw);
      justify-self: end;
      border-radius: 26px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      transform: translateY(12px);
      opacity: 0;
      animation: floatIn 1s var(--ease) 120ms forwards;
    }

    .hero-cta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .btn {
      text-decoration: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 0.9rem;
      transition: transform var(--ease), background var(--ease), color var(--ease);
    }

    .btn.primary {
      background: linear-gradient(160deg, var(--gold-soft), var(--gold));
      color: #20150f;
      box-shadow: var(--shadow);
    }

    .btn.ghost {
      border: 1px solid var(--line);
      color: var(--ink);
      background: rgba(255, 255, 255, 0.04);
    }

    .btn:hover { transform: translateY(-2px); }

    section { margin-top: 74px; }

    #highlights {
      margin-top: 0;
    }

    h2 {
      margin: 0 0 12px;
      font-size: var(--subtitle);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .copy {
      margin: 0;
      color: var(--ink-soft);
      line-height: 1.76;
      max-width: 62ch;
    }

    .highlights-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 14px;
    }

    .highlights-head p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.92rem;
    }

    .highlights-rail {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(380px, 92vw);
      gap: 12px;
      overflow-x: auto;
      padding: 4px 2px 12px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    .highlights-pagination {
      margin-top: 12px;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .page-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      border: 0;
      padding: 0;
      background: rgba(255, 255, 255, 0.28);
      cursor: pointer;
      transition: transform 220ms ease, background 220ms ease;
    }

    .page-dot.active {
      background: var(--gold-soft);
      transform: scale(1.35);
    }

    .highlight-card {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      min-height: 78vh;
      scroll-snap-align: start;
      background: #111;
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .highlight-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1.02);
      transition: transform 700ms var(--ease);
    }

    .highlight-card:hover img {
      transform: scale(1.07);
    }

    .highlight-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(8, 10, 14, 0.06), rgba(8, 10, 14, 0.58));
      z-index: 1;
    }

    .highlight-card span {
      position: absolute;
      left: 14px;
      bottom: 12px;
      z-index: 2;
      font-size: 0.86rem;
      letter-spacing: 0.05em;
      color: var(--ink);
    }

    .spec {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 22px;
    }

    .spec article {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
    }

    .spec strong {
      display: block;
      font-size: 1.18rem;
      margin-bottom: 6px;
      color: var(--gold-soft);
    }

    .gallery {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      margin-top: 20px;
    }

    .shot {
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      position: relative;
      min-height: 220px;
      background: #111;
    }

    .shot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1.03);
      transition: transform 700ms var(--ease);
    }

    .shot:hover img { transform: scale(1.08); }

    .shot.a { grid-column: span 7; min-height: 460px; }
    .shot.b { grid-column: span 5; min-height: 460px; }
    .shot.c { grid-column: span 5; min-height: 320px; }
    .shot.d { grid-column: span 7; min-height: 320px; }

    .storyline {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .storyline article {
      border-left: 2px solid rgba(215, 164, 111, 0.5);
      padding: 6px 0 6px 14px;
    }

    .price {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(160deg, rgba(255, 255, 255, 0.03), rgba(215, 164, 111, 0.12)),
        var(--card);
      padding: 24px;
      margin-top: 22px;
      box-shadow: var(--shadow);
    }

    .price strong {
      font-size: clamp(1.8rem, 8vw, 3rem);
      color: var(--gold-soft);
      letter-spacing: -0.02em;
    }

    .price p {
      color: var(--ink-soft);
      margin: 8px 0 16px;
    }

    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 620ms ease, transform 620ms ease;
    }

    .reveal.in {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(28px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 860px) {
      .hero {
        min-height: 86vh;
        align-content: center;
      }

      .hero-img {
        justify-self: start;
        width: min(520px, 92vw);
      }

      .shot.a,
      .shot.b,
      .shot.c,
      .shot.d {
        grid-column: span 12;
        min-height: 320px;
      }

      .highlights-rail {
        grid-auto-columns: 92vw;
        padding-left: 4vw;
        padding-right: 4vw;
        scroll-padding-left: 4vw;
        scroll-padding-right: 4vw;
      }

      .highlight-card {
        min-height: 70vh;
        scroll-snap-align: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <div class="page">
    <nav class="nav" id="nav">
      <a class="logo" href="#top">鼻烟壶</a>
      <a class="buy-mini" href="../main.html">回到主页</a>
    </nav>

    <!-- <header class="hero" id="top">
      <div class="hero-kicker">BYH 2026 COLLECTION</div>
      <h1>鼻烟壶，小器见大境</h1>
      <p>tbd</p>
      <div class="hero-cta">
        <a class="btn primary" href="#gallery">探索细节</a>
        <a class="btn ghost" href="#craft">了解工艺</a>
      </div>
      <img class="hero-img" src="pic/鼻烟壶_001.jpg" alt="鼻烟壶主视觉" />
    </header> -->

    <section class="reveal" id="highlights">
      <div class="highlights-head">
        <h2>小器见大境</h2>
        <!-- <p>左右横划，查看鼻烟壶细节。</p> -->
      </div>
      <div class="highlights-rail" aria-label="鼻烟壶横向图片展示">
        <figure class="highlight-card"><img src="pic/鼻烟壶_006.jpg" alt="鼻烟壶高光图 1" /><span>八仙</span></figure>
        <figure class="highlight-card"><img src="pic/鼻烟壶_004.jpg" alt="鼻烟壶高光图 2" /><span>八仙</span></figure>
        <figure class="highlight-card"><img src="pic/鼻烟壶_003.jpg" alt="鼻烟壶高光图 3" /><span>观音</span></figure>
        <figure class="highlight-card"><img src="pic/鼻烟壶_002.jpg" alt="鼻烟壶高光图 4" /><span>观音</span></figure>
        <figure class="highlight-card"><img src="pic/鼻烟壶_001.jpg" alt="鼻烟壶高光图 5" /><span>黛玉</span></figure>
        <figure class="highlight-card"><img src="pic/鼻烟壶_005.jpg" alt="鼻烟壶高光图 6" /><span>黛玉</span></figure>
      </div>
      <div class="highlights-pagination" aria-label="轮播分页指示器">
        <button class="page-dot active" type="button" aria-label="第 1 张"></button>
        <button class="page-dot" type="button" aria-label="第 2 张"></button>
        <button class="page-dot" type="button" aria-label="第 3 张"></button>
        <button class="page-dot" type="button" aria-label="第 4 张"></button>
        <button class="page-dot" type="button" aria-label="第 5 张"></button>
        <button class="page-dot" type="button" aria-label="第 6 张"></button>
      </div>
    </section>

    <section class="reveal" id="buy" hidden>
      <h2>收藏款 · 鼻烟壶 006</h2>
      <div class="price">
        <strong>¥ 1,680</strong>
        <p>含定制礼盒、鉴定卡与一年养护建议。支持线上预约与线下鉴赏。</p>
        <a class="btn primary" href="#top">立即预订</a>
      </div>
    </section>
  </div>

  <script>
    const nav = document.getElementById("nav");
    window.addEventListener("scroll", () => {
      nav.classList.toggle("scrolled", window.scrollY > 10);
    });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add("in");
        }
      });
    }, { threshold: 0.16 });

    document.querySelectorAll(".reveal").forEach((el) => observer.observe(el));

    const rail = document.querySelector(".highlights-rail");
    const cards = rail ? Array.from(rail.querySelectorAll(".highlight-card")) : [];
    const dots = Array.from(document.querySelectorAll(".page-dot"));

    const setActiveDot = (index) => {
      dots.forEach((dot, i) => {
        dot.classList.toggle("active", i === index);
      });
    };

    if (rail && cards.length && dots.length) {
      dots.forEach((dot, index) => {
        dot.addEventListener("click", () => {
          cards[index].scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
          setActiveDot(index);
        });
      });

      rail.addEventListener("scroll", () => {
        const left = rail.scrollLeft;
        let nearest = 0;
        let minDist = Number.POSITIVE_INFINITY;

        cards.forEach((card, index) => {
          const dist = Math.abs(card.offsetLeft - left);
          if (dist < minDist) {
            minDist = dist;
            nearest = index;
          }
        });

        setActiveDot(nearest);
      }, { passive: true });
    }
  </script>
</body>
</html>
